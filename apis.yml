name: MyTime
description: MyTime is an all-in-one business management platform for retail service
  chains and franchises, combining point-of-sale (POS), online appointment scheduling,
  integrated payments, customer management, inventory, staff and payroll tools, loyalty,
  reputation management, and marketing automation across single- and multi-location
  operations. It serves beauty salons, barbershops, pet grooming, wellness spas, and
  learning services, offering omnichannel booking (web, Google Reserve, Instagram/Facebook,
  ClassPass) and analytics. MyTime runs a first-party API host (api.mytime.com) that
  backs its web and native iPhone/Android apps, and offers partner integrations (Stripe,
  QuickBooks, Shopify, ADP, Zapier), but does not publish a public developer API portal
  or OpenAPI definition. Backed by 500 Global.
